name = "dravonix-project-estimator"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Builds (and a bare `wrangler deploy`) only run one
# command by default. Without this hook, `.open-next/` never gets
# generated and deploy fails with "Could not find compiled Open Next
# config". This runs the OpenNext build automatically before every deploy.
[build]
command = "npm run cf:build"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Custom domain: attach estimate.dravonix.dev to this Worker via
# Cloudflare Pages/Workers custom domains (see README "Cloudflare
# deployment"). Environment variables and secrets are configured through
# `wrangler secret put <NAME>` or the Cloudflare dashboard — do not commit
# real values here.
