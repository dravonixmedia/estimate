name = "dravonix-project-estimator"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Builds (and a bare `wrangler deploy`) only run one
# command by default. Without this hook, `.open-next/` never gets
# generated and deploy fails with "Could not find compiled Open Next
# config". This runs the OpenNext build automatically before every deploy.
[build]
command = "npm run cf:build"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability.logs]
enabled = true
invocation_logs = true

# Non-secret runtime config. `wrangler deploy` treats this file as the
# authoritative source of Worker vars on every deploy — plaintext
# variables added only through the dashboard UI get silently dropped by
# the next Git-triggered deployment (confirmed: this happened repeatedly
# in production). SUPABASE_URL and SUPABASE_ANON_KEY are safe to commit —
# the anon/publishable key is designed to be public, protected by Row
# Level Security, not secrecy. TRUE secrets (SUPABASE_SERVICE_ROLE_KEY,
# CLAUDE_API_KEY) must stay dashboard/`wrangler secret`-only and never be
# added here.
[vars]
SUPABASE_URL = "https://npcaeaxvypndskgmtvph.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_qNM2a48RQ88fsl8R3yO3Eg_IUwUmHKO"
WHATSAPP_NUMBER = "918086552536"

# Lets the Worker send admin lead-notification emails via Cloudflare Email
# Routing instead of a third-party provider/API key. Requires, one-time,
# in the Cloudflare dashboard:
#   1. Email → Email Routing → enable it for the dravonixmedia.com zone.
#   2. Add admin@dravonixmedia.com as a destination address and verify it
#      (click the link Cloudflare emails to that inbox).
# See README "Email notifications" for the full walkthrough.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "admin@dravonixmedia.com"
